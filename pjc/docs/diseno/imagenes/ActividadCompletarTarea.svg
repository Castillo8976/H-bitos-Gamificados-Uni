<svg viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="700" height="900" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2A">Diagrama de Actividades — CU03: Completar tarea y recibir recompensa</text>

  <!-- Start -->
  <circle cx="350" cy="70" r="12" fill="#2C2C2A"/>

  <!-- Activity 1 -->
  <rect x="230" y="110" width="240" height="40" rx="20" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="350" y="135" text-anchor="middle" font-size="12">Activar checkbox de la tarea</text>
  <line x1="350" y1="82" x2="350" y2="110" stroke="#2C2C2A"/>

  <!-- Activity 2 -->
  <rect x="230" y="180" width="240" height="40" rx="20" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="350" y="205" text-anchor="middle" font-size="12">Cambiar estado a "Completada"</text>
  <line x1="350" y1="150" x2="350" y2="180" stroke="#2C2C2A"/>

  <!-- Activity 3 -->
  <rect x="230" y="250" width="240" height="40" rx="20" fill="#FDF3E3" stroke="#854F0B"/>
  <text x="350" y="275" text-anchor="middle" font-size="12">Otorgar puntos (RN08, RN07)</text>
  <line x1="350" y1="220" x2="350" y2="250" stroke="#2C2C2A"/>

  <!-- Decision 1 -->
  <polygon points="350,310 410,350 350,390 290,350" fill="#F1EFE8" stroke="#2C2C2A"/>
  <text x="350" y="354" text-anchor="middle" font-size="11">¿Cumple condición</text>
  <text x="350" y="367" text-anchor="middle" font-size="11">de insignia?</text>
  <line x1="350" y1="290" x2="350" y2="310" stroke="#2C2C2A"/>

  <!-- Branch: Yes -->
  <rect x="440" y="330" width="220" height="40" rx="20" fill="#FDF3E3" stroke="#854F0B"/>
  <text x="550" y="355" text-anchor="middle" font-size="12">Desbloquear insignia (RN11)</text>
  <line x1="410" y1="350" x2="440" y2="350" stroke="#2C2C2A"/>
  <text x="418" y="342" font-size="11">sí</text>

  <rect x="440" y="400" width="220" height="40" rx="20" fill="#FDF3E3" stroke="#854F0B"/>
  <text x="550" y="425" text-anchor="middle" font-size="12">Mostrar animación de celebración</text>
  <line x1="550" y1="370" x2="550" y2="400" stroke="#2C2C2A"/>

  <!-- Branch: No -->
  <line x1="350" y1="390" x2="350" y2="440" stroke="#2C2C2A"/>
  <text x="358" y="410" font-size="11">no</text>

  <!-- Merge point -->
  <line x1="550" y1="440" x2="350" y2="480" stroke="#2C2C2A"/>
  <line x1="350" y1="440" x2="350" y2="480" stroke="#2C2C2A"/>

  <!-- Decision 2: Reto -->
  <polygon points="350,480 420,520 350,560 280,520" fill="#F1EFE8" stroke="#2C2C2A"/>
  <text x="350" y="524" text-anchor="middle" font-size="11">¿Progreso del reto</text>
  <text x="350" y="537" text-anchor="middle" font-size="11">semanal completo?</text>

  <rect x="440" y="500" width="220" height="40" rx="20" fill="#FDF3E3" stroke="#854F0B"/>
  <text x="550" y="525" text-anchor="middle" font-size="12">Otorgar puntos del reto (RN10)</text>
  <line x1="420" y1="520" x2="440" y2="520" stroke="#2C2C2A"/>
  <text x="428" y="512" font-size="11">sí</text>
  <line x1="350" y1="560" x2="350" y2="620" stroke="#2C2C2A"/>
  <text x="358" y="580" font-size="11">no</text>
  <line x1="550" y1="540" x2="550" y2="590" stroke="#2C2C2A"/>
  <line x1="550" y1="590" x2="350" y2="620" stroke="#2C2C2A"/>

  <!-- Activity: update report -->
  <rect x="230" y="620" width="240" height="40" rx="20" fill="#EAF2FA" stroke="#185FA5"/>
  <text x="350" y="645" text-anchor="middle" font-size="12">Actualizar reporte semanal (RN14)</text>

  <!-- Activity: update panel -->
  <rect x="230" y="690" width="240" height="40" rx="20" fill="#EAF2FA" stroke="#185FA5"/>
  <text x="350" y="715" text-anchor="middle" font-size="12">Actualizar panel de progreso</text>
  <line x1="350" y1="660" x2="350" y2="690" stroke="#2C2C2A"/>

  <!-- End -->
  <line x1="350" y1="730" x2="350" y2="760" stroke="#2C2C2A"/>
  <circle cx="350" cy="775" r="14" fill="none" stroke="#2C2C2A" stroke-width="2"/>
  <circle cx="350" cy="775" r="8" fill="#2C2C2A"/>

  <text x="350" y="830" text-anchor="middle" font-size="11" fill="#666">Corresponde al flujo normal + alternativos A1/A2 de CU03 (07-casos-de-uso.md) y a Seq-02 (M10_diagramas_secuencia.md)</text>
  <text x="350" y="848" text-anchor="middle" font-size="11" fill="#666">Generado en revisión de agosto 2026 — primer diagrama de actividades del proyecto (antes no existía ninguno)</text>
</svg>
